<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mayo Petshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --do:#BE1E2D; --do-dam:#8E1220; --do-nhat:#FBEAEC;
  --kem:#FFFCF7; --the:#FFFFFF; --muc:#241D1A; --xam:#8C8079; --vien:#EDE4DA;
  --xanh:#1E7A4F; --xanh-nhat:#E6F3EC; --cam:#B5710E; --cam-nhat:#FBF0DC;
  --r:14px; --at:env(safe-area-inset-top); --ab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;height:100dvh}
/* Chỉ chạy hoạt ảnh trên transform và opacity — hai thứ trình duyệt vẽ thẳng
   trên GPU, không phải tính lại bố cục. Đó là điều kiện để giữ 60fps. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
body{
  font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--kem);color:var(--muc);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{border:0;background:none;cursor:pointer}
a{text-decoration:none;color:inherit}
.hide{display:none!important}

/* Dải kẻ caro — chữ ký thương hiệu Mayo */
.caro{height:8px;background:
  repeating-linear-gradient(90deg,var(--do) 0 12px,transparent 12px 24px),
  repeating-linear-gradient(0deg,var(--do) 0 4px,#fff 4px 8px);
  background-size:24px 8px,24px 8px;flex:0 0 auto}

/* ---------- Đăng nhập ---------- */
#manDangNhap{position:fixed;inset:0;background:var(--kem);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;z-index:200}
.logo{font-size:40px;font-weight:800;letter-spacing:.12em;color:var(--do);line-height:1}
.logo-sub{font-size:11px;letter-spacing:.22em;color:var(--xam);font-weight:600;margin-top:6px}
.logo-anh{max-width:260px;max-height:120px;width:auto;height:auto;display:block;
  animation:hienLogo .45s cubic-bezier(.32,.72,0,1) both}
@keyframes hienLogo{from{opacity:0;transform:scale(.94)}}
@media (max-width:380px){.logo-anh{max-width:210px;max-height:100px}}
.pin-o{display:flex;gap:14px;margin:34px 0 26px}
.pin-o i{width:16px;height:16px;border-radius:50%;border:2px solid var(--do);display:block}
.pin-o i.phu{border-style:dashed;opacity:.45}
.pin-o i.phu.on{opacity:1;border-style:solid}
.pin-o i{transition:background .18s ease,transform .18s cubic-bezier(.34,1.56,.64,1)}
.pin-o i.on{background:var(--do);transform:scale(1.15)}
.keys{display:grid;grid-template-columns:repeat(3,84px);gap:16px}
.keys button{height:74px;border-radius:50%;background:var(--the);border:1px solid var(--vien);
  font-size:28px;font-weight:500;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.keys button{transition:transform .1s cubic-bezier(.32,.72,0,1),background .14s ease}
.keys button:active{background:var(--do-nhat);transform:scale(.92)}
.keys button.plain{background:none;border:0;font-size:15px;color:var(--xam);box-shadow:none}
.loi{color:var(--do);min-height:22px;font-size:14px;margin-top:18px;font-weight:600;
  text-align:center;max-width:340px;line-height:1.5}

/* ---------- Khung app ---------- */
#app{display:none;flex-direction:column;height:100%}
header{position:sticky;top:0;z-index:50;background:var(--kem);padding-top:var(--at);
  border-bottom:1px solid var(--vien)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;min-height:56px;
  max-width:672px;margin:0 auto}
.hd h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.hd .ai{font-size:12px;color:var(--xam);font-weight:500}
.nut-tron{width:40px;height:40px;border-radius:50%;background:var(--the);border:1px solid var(--vien);
  display:grid;place-items:center;font-size:18px;flex:0 0 auto}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* Bề ngang tối đa: dòng chữ dài quá 70 ký tự là mắt phải quét ngang, mệt.
   Trên iPad và máy tính, nội dung canh giữa thay vì kéo dãn hết màn hình. */
main>*{max-width:672px;margin-left:auto;margin-right:auto}
main{padding:16px 16px calc(100px + var(--ab))}
main>*{animation:hien .22s cubic-bezier(.32,.72,0,1) both}
/* Khung xương: cho mắt thấy bố cục sắp tới thay vì một khoảng trắng.
   Chuyển động chỉ trên background-position nên không làm nghẽn luồng dựng hình. */
.xuong{background:linear-gradient(100deg,#F6F1EB 30%,#FBF7F2 45%,#F6F1EB 60%);
  background-size:300% 100%;border-color:transparent;animation:xuongChay 1.15s ease-in-out infinite}
@keyframes xuongChay{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes hien{from{opacity:0;transform:translateY(6px)}}
main.doi>*{animation:hien .26s cubic-bezier(.32,.72,0,1) both}

/* ---------- Thanh tab dưới ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,252,247,.94);
  backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--vien);
  display:flex;justify-content:center;padding-bottom:var(--ab)}
nav button{flex:1 1 0;max-width:120px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--xam);font-size:10.5px;font-weight:600;min-height:52px}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav button{transition:color .18s ease}
nav button svg{transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
nav button.on{color:var(--do)}
nav button.on svg{transform:translateY(-2px) scale(1.08)}

/* ---------- Thành phần ---------- */
.the{background:var(--the);border:1px solid var(--vien);border-radius:var(--r);padding:14px;
  margin-bottom:10px;transition:transform .16s cubic-bezier(.32,.72,0,1),
  border-color .16s ease,box-shadow .16s ease}
.the[onclick]:active{transform:scale(.985)}
.the:last-child{margin-bottom:0}
.muc{font-size:12.5px;font-weight:700;color:var(--xam);letter-spacing:.01em;margin:22px 2px 9px}
.muc:first-child{margin-top:2px}
.hang{display:flex;align-items:center;gap:10px}
.giua{flex:1;min-width:0}
.cat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nho{font-size:13px;color:var(--xam)}
.rnho{font-size:11.5px;color:var(--xam)}
.dam{font-weight:700}
.tien{font-variant-numeric:tabular-nums;font-weight:700}

.nut{background:var(--do);color:#fff;border-radius:11px;padding:13px 18px;font-weight:600;
  font-size:15px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.nut{transition:transform .12s cubic-bezier(.32,.72,0,1),background .14s ease,opacity .14s ease;
  will-change:transform}
.nut:active{background:var(--do-dam);transform:scale(.97)}
.nut.phu{background:var(--the);color:var(--muc);border:1px solid var(--vien)}
.nut.nhe{background:var(--do-nhat);color:var(--do)}
.nut.rong{width:100%}
.nut.be{padding:8px 12px;min-height:36px;font-size:13.5px;border-radius:9px}
.nut[disabled]{opacity:.45}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3.5px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;background:var(--do-nhat);color:var(--do);white-space:nowrap}
.chip{transition:transform .12s ease,background .16s ease,color .16s ease}
button.chip:active{transform:scale(.94)}
.chip.xam{background:#F2EDE7;color:var(--xam)}
.chip.xanh{background:var(--xanh-nhat);color:var(--xanh)}
.chip.cam{background:var(--cam-nhat);color:var(--cam)}

label{display:block;font-size:12.5px;font-weight:600;color:var(--xam);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--vien);border-radius:11px;
  background:var(--the);min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--do);outline-offset:-1px}
textarea{min-height:76px;resize:vertical}
.doi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Ô số liệu dashboard */
.o{background:var(--the);border:1px solid var(--vien);border-radius:var(--r);padding:11px 13px 12px}
.o b{display:block;font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.2;
  font-variant-numeric:tabular-nums}
.o span{font-size:11.5px;color:var(--xam);font-weight:600}
.o.nhan{background:var(--do);border-color:var(--do)}
.o.nhan b,.o.nhan span{color:#fff}
.o.nhan span{opacity:.85}

/* Thẻ lịch hẹn */
.ca{background:var(--the);border:1px solid var(--vien);border-left:4px solid var(--xam);
  border-radius:var(--r);padding:13px 14px;margin-bottom:9px}
/* Giờ là thứ mắt tìm đầu tiên khi liếc bảng lịch, nên nó đứng riêng một cột
   có vạch ngăn, không trôi lẫn vào tên bé. */
.ca .gio{width:60px;flex:0 0 auto;border-right:1px solid var(--vien);
  padding-right:12px;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.ca .gio b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;line-height:1.1;display:block}
.ca .gio span{font-size:11px;color:var(--xam);font-weight:600}
.ca .ten{font-weight:700;font-size:16px;letter-spacing:-.01em}
.ca .tien{font-size:15px}
.ca-cho{border-left-color:var(--cam)}
.ca-xn{border-left-color:#3B6FB5}
.ca-den{border-left-color:var(--do)}
.ca-xong{border-left-color:var(--xanh);background:#FCFDFC}
.ca-huy,.ca-khong{border-left-color:#C9C0B8;opacity:.62}
.tt{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;padding-left:121px}
.ca-huy .tt,.ca-khong .tt{padding-left:121px}

/* Bảng đơn giản */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;color:var(--xam);font-weight:700;padding:7px 6px;
  border-bottom:1px solid var(--vien)}
td{padding:9px 6px;border-bottom:1px solid #F5F0EA;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* Tấm trượt lên (sheet) */
.tam{position:fixed;inset:0;z-index:120;display:none}
.tam.mo{display:block}
.nen{position:absolute;inset:0;background:rgba(36,29,26,.42);
  animation:mo .2s ease both;backdrop-filter:blur(2px)}
@keyframes mo{from{opacity:0}}
.noi{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:720px;
  max-height:93vh;background:var(--kem);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  box-shadow:0 -8px 40px rgba(36,29,26,.16);animation:len .26s cubic-bezier(.32,.72,0,1)}
@keyframes len{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.noi{animation:none}}
.noi-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--vien)}
.noi-hd h2{margin:0;font-size:17px;font-weight:700;flex:1}
.noi-body{overflow-y:auto;padding:14px 16px calc(20px + var(--ab));-webkit-overflow-scrolling:touch}

/* Danh sách chọn */
.chon{display:flex;align-items:center;gap:11px;padding:13px;background:var(--the);
  border:1px solid var(--vien);border-radius:12px;margin-bottom:8px;width:100%;text-align:left}
.chon{transition:transform .14s cubic-bezier(.32,.72,0,1),border-color .16s ease,background .16s ease}
.chon:active{transform:scale(.985)}
.chon.on{border-color:var(--do);background:var(--do-nhat)}
.tick{width:22px;height:22px;border-radius:6px;border:1.7px solid var(--vien);flex:0 0 auto;
  display:grid;place-items:center;font-size:13px;color:#fff}
.chon.on .tick{background:var(--do);border-color:var(--do)}

.trong{text-align:center;padding:44px 20px;color:var(--xam)}
.trong b{display:block;font-size:16px;color:var(--muc);margin-bottom:5px}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--ab));transform:translateX(-50%);
  background:var(--muc);color:#fff;padding:11px 18px;border-radius:11px;font-size:14px;
  font-weight:500;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.hien{opacity:1}
/* Vạch mảnh trên đỉnh màn hình. Hộp đen nổi giữa đầu trang che mất tiêu đề
   và kéo mắt khỏi việc đang làm — chuyển thành thứ chỉ nhìn thấy khi cần biết. */
#tai{position:fixed;top:0;left:0;right:0;height:3px;z-index:250;display:none;
  overflow:hidden;background:var(--do-nhat);font-size:0}
#tai::after{content:'';position:absolute;top:0;bottom:0;left:0;width:38%;
  background:var(--do);animation:chay 1.1s cubic-bezier(.65,0,.35,1) infinite}
@keyframes chay{from{transform:translateX(-110%)}to{transform:translateX(370%)}}
@media (prefers-reduced-motion:reduce){#tai::after{animation:none;width:100%;opacity:.5}}
.anh-o{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#F2EDE7;display:block}
/* Máy nhỏ: bàn phím và chữ co lại để không phải cuộn ở màn đăng nhập */
@media (max-width:380px){
  body{font-size:15.5px}
  .keys{grid-template-columns:repeat(3,74px);gap:12px}
  .keys button{height:66px;font-size:25px}
  .logo{font-size:34px}
  main{padding:14px 12px calc(96px + var(--ab))}
  .the{padding:12px}
  .o b{font-size:21px}
  .hd h1{font-size:19px}
  nav button{font-size:9.5px}
  nav button svg{width:21px;height:21px}
}
@media (max-height:680px){
  .keys button{height:60px}
  .pin-o{margin:22px 0 18px}
  #manDangNhap{justify-content:flex-start;padding-top:calc(var(--at) + 28px)}
}
/* Ảnh tròn trước tên bé: nhận ra bé bằng mắt nhanh hơn nhiều so với đọc tên,
   nhất là khi tiệm có ba con Poodle cùng tên Bông. */
.av{border-radius:50%;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;
  background:var(--do-nhat);color:var(--do);font-weight:800;line-height:1;
  border:1.5px solid var(--the);box-shadow:0 0 0 1px var(--vien)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av i{font-style:normal}
.luoi-anh{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.luoi-anh .o-anh{position:relative}
.luoi-anh .o-anh button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
  background:rgba(36,29,26,.72);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center}
.them-anh{aspect-ratio:1;border:1.5px dashed var(--vien);border-radius:12px;display:grid;
  place-items:center;color:var(--xam);font-size:22px;background:var(--the)}
.sk-tre{border-color:var(--do)!important;background:var(--do-nhat)!important}

/* Băng chuyền banner */
.bn{margin-bottom:14px}
.bn-cuon{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:var(--r)}
.bn-cuon::-webkit-scrollbar{display:none}
.bn-o{flex:0 0 100%;scroll-snap-align:center;position:relative;border-radius:var(--r);overflow:hidden}
.bn-o{cursor:pointer;transition:transform .16s cubic-bezier(.32,.72,0,1)}
.bn-o:active{transform:scale(.985)}
.bn-o img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--do-nhat)}
.bn-nhan{position:absolute;top:10px;left:10px;background:var(--do);color:#fff;
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.bn-nhan.sap{background:var(--cam)}
.bn-chu{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 14px;color:#fff;
  background:linear-gradient(to top,rgba(36,29,26,.78),transparent)}
.bn-chu b{display:block;font-size:16px;font-weight:700}
.bn-chu span{font-size:12.5px;opacity:.9}
.bn-cham{display:flex;justify-content:center;gap:6px;margin-top:9px}
.bn-cham i{width:6px;height:6px;border-radius:50%;background:var(--vien);display:block;
  transition:width .25s cubic-bezier(.32,.72,0,1),background .25s ease}
.bn-cham i.on{width:18px;background:var(--do)}
.dai{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.dai>*{flex:0 0 auto}
.cot{display:flex;align-items:flex-end;gap:3px;height:78px;margin:8px 0 4px}
.cot i{flex:1;background:var(--do-nhat);border-radius:3px 3px 0 0;min-height:2px;display:block}
.cot i.max{background:var(--do)}

/* Máy tính từ 1100px: chuyển thanh tab xuống dưới thành cột dọc bên trái.
   Thanh dưới màn hình là quy ước của điện thoại; trên màn rộng nó vừa xa tay
   vừa lãng phí chiều ngang. */
@media (min-width:1100px){
  #app{flex-direction:row}
  nav{position:fixed;left:0;top:0;bottom:0;right:auto;width:212px;height:100%;
    flex-direction:column;justify-content:flex-start;gap:4px;
    border-top:0;border-right:1px solid var(--vien);padding:88px 14px 20px}
  nav button{flex:0 0 auto;max-width:none;width:100%;flex-direction:row;justify-content:flex-start;
    gap:12px;font-size:14.5px;padding:12px 14px;border-radius:11px;min-height:46px}
  nav button svg{width:20px;height:20px}
  nav button.on{background:var(--do-nhat)}
  nav button.on svg{transform:none}
  header{position:fixed;left:0;top:0;right:0;z-index:70;background:var(--kem)}
  .hd{max-width:none;padding-left:226px}
  main{margin-left:212px;padding:78px 28px 40px}
  main>*{max-width:820px;margin-left:0}
  .noi{border-radius:20px;bottom:auto;top:50%;transform:translate(-50%,-50%);max-height:86vh;max-width:660px}
  @keyframes len{from{opacity:0;transform:translate(-50%,-46%) scale(.98)}
                 to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
}

/* iPad ngang và máy tính: xếp ca thành hai cột. Danh sách một cột dài
   trên màn 1200px khiến mắt phải cuộn nhiều mà hai phần ba màn hình bỏ trống. */
@media (min-width:960px) and (max-width:1099px){
  main>*{max-width:940px}
  #dsCa{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}
  #dsCa .muc{grid-column:1 / -1}
}
@media (min-width:1100px){
  #dsCa{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-items:start}
  #dsCa .muc{grid-column:1 / -1}
}
</style>
</head>
<body>

<div id="tai">Đang tải…</div>
<div id="toast"></div>

<!-- ══════════ ĐĂNG NHẬP ══════════ -->
<div id="manDangNhap">
  <? if (LOGO) { ?>
    <img class="logo-anh" src="<?= LOGO ?>" alt="Mayo">
  <? } else { ?>
    <div class="logo">MAYO</div>
    <div class="logo-sub">PETSHOP · SPA &amp; GROOMING</div>
  <? } ?>
  <div class="rnho" style="margin-top:22px;text-align:center;max-width:300px">
    Nhân viên nhập 4 số · khách nhập mã tra cứu 6 số</div>
  <div class="pin-o" id="pinO"><i></i><i></i><i></i><i></i><i class="phu"></i><i class="phu"></i></div>
  <div class="keys" id="phim"></div>
  <div class="loi" id="loiDN"></div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">
  <header>
    <div class="caro"></div>
    <div class="hd">
      <div class="giua">
        <h1 id="tieuDe">Hôm nay</h1>
        <div class="ai" id="phuDe"></div>
      </div>
      <button class="nut-tron" id="nutHd" onclick="hanhDongHeader()">＋</button>
    </div>
  </header>

  <main id="mh"></main>

  <nav id="tabs"></nav>
</div>

<!-- Tấm trượt -->
<div class="tam" id="tam">
  <div class="nen" onclick="dongTam()"></div>
  <div class="noi">
    <div class="noi-hd">
      <h2 id="tamTieuDe"></h2>
      <button class="nut-tron" onclick="dongTam()">✕</button>
    </div>
    <div class="noi-body" id="tamNoi"></div>
  </div>
</div>

<canvas id="canvasBG" width="1080" height="1500" style="display:none"></canvas>
<input type="file" id="chonAnh" accept="image/*" style="display:none">

<script>
/* ═══════════ TRẠNG THÁI ═══════════ */
var S = { token:null, user:null, D:null, tab:'homNay', ngay:null, phu:null,
          dsBe:[], lich:[], lichNgay:null, logoB64:'', qrB64:'', _be:null,
          cache:{}, cacheJS:{} };
var PIN = '';

/* ═══════════ TIỆN ÍCH ═══════════ */
function $(id){return document.getElementById(id);}
function avatar(b,sz){
  sz=sz||38;
  var id=b&&b.AnhChinh, ten=(b&&b.TenBe)||'?';
  return '<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*0.42)+'px">'+
    (id?'<img loading="lazy" src="https://drive.google.com/thumbnail?id='+esc(id)+'&sz=w'+(sz*3)+'">'
       :'<i>'+esc(ten.charAt(0).toUpperCase())+'</i>')+'</span>';
}
function chuanLoai(s){return String(s||'').replace(/Chó/g,'Cún');}
function sdt(s){
  var d=String(s||'').replace(/[^\d+]/g,'');
  return /^[35789]\d{8}$/.test(d)?'0'+d:String(s||'');
}
function beTheoMa(ma){
  for(var i=0;i<S.dsBe.length;i++)if(S.dsBe[i].MaBe===ma)return S.dsBe[i];
  return null;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function tien(n){n=Math.round(parseFloat(n)||0);return n.toLocaleString('vi-VN')+'đ';}
function tienNgan(n){n=Math.round(parseFloat(n)||0);
  return n>=1000000?(n/1000000).toFixed(n%1000000?1:0)+'tr':n>=1000?Math.round(n/1000)+'k':n;}
function num(v){return parseFloat(String(v==null?0:v).replace(/[^\d.-]/g,''))||0;}
function hnay(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return n<10?'0'+n:''+n;}
function ngayVN(s){if(!s)return'';var p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]:s;}
function themNgay(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function thu(s){return ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy']
  [new Date(s+'T00:00:00').getDay()];}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('hien');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('hien');},2400);}
var _dangTai=0,_taiHen=null;
function tai(on){
  _dangTai=Math.max(0,_dangTai+(on?1:-1));
  $('tai').style.display=_dangTai?'block':'none';
  clearTimeout(_taiHen);
  // Nếu một yêu cầu chết giữa đường, vạch tải không được phép treo mãi.
  if(_dangTai)_taiHen=setTimeout(function(){_dangTai=0;$('tai').style.display='none';},20000);
}

function goi(action,p,nen){
  if(!nen)tai(true);
  return new Promise(function(res,rej){
    google.script.run
      .withSuccessHandler(function(r){
        if(!nen)tai(false);
        if(r&&r.ok) res(r.data);
        else{
          if(r&&r.msg==='PHIEN_HET_HAN'){dangXuat();rej(new Error('Phiên đã hết hạn, đăng nhập lại.'));return;}
          if(!nen)toast(r?r.msg:'Không nhận được phản hồi');
          rej(new Error(r?r.msg:'Lỗi'));
        }})
      .withFailureHandler(function(e){
        if(!nen){tai(false);toast('Mất kết nối. Thử lại.');}
        rej(e);})
      .api(S.token,action,p||{});
  });
}

/* ═══════════ ĐĂNG NHẬP ═══════════ */
(function(){
  var h='';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button onclick="go('+n+')">'+n+'</button>';});
  h+='<button class="plain" onclick="xoaPin()">Xoá</button><button onclick="go(0)">0</button>'+
     '<button class="plain" onclick="lui()">←</button>';
  $('phim').innerHTML=h;
})();
function veO(){
  var o=$('pinO').children;
  for(var i=0;i<6;i++)o[i].className=(i<4?'':'phu ')+(i<PIN.length?'on':'');
}
var _lanDN=0,_henDN=null;
function go(n){
  if(PIN.length>=6)return;
  PIN+=n;veO();$('loiDN').textContent='';
  clearTimeout(_henDN);
  if(PIN.length===6){vao();return;}            // mã khách: đủ 6 số là vào ngay
  if(PIN.length===4)_henDN=setTimeout(vao,700); // mã nhân viên: chờ xem có gõ tiếp không
}
function lui(){clearTimeout(_henDN);PIN=PIN.slice(0,-1);veO();$('loiDN').textContent='';}
function xoaPin(){clearTimeout(_henDN);PIN='';veO();$('loiDN').textContent='';}
function coMayChu(){
  return typeof google!=='undefined' && google.script && google.script.run;
}
function baoSaiCach(){
  $('loiDN').innerHTML='Trang này không kết nối được máy chủ.<br>'+
    '<span style="color:var(--xam);font-weight:500">File index.html trên GitHub phải là bản chỉ có thẻ iframe, '+
    'không phải toàn bộ giao diện app.</span>';
  PIN='';veO();tai(false);
}
function vao(){
  if(!coMayChu()){baoSaiCach();return;}
  var lan=++_lanDN, doDai=PIN.length;
  tai(true);
  google.script.run.withSuccessHandler(function(r){
    if(lan!==_lanDN){tai(false);return;}       // đã có lần thử mới, bỏ câu trả lời cũ
    tai(false);
    if(!r.ok){
      // Trượt ở mốc 4 số chỉ có nghĩa "chưa phải mã nhân viên", không phải sai mã.
      if(doDai===4&&PIN.length===4){
        $('loiDN').innerHTML='<span style="color:var(--xam);font-weight:500">'+
          'Chưa khớp mã nhân viên — nếu là mã khách, gõ tiếp 2 số nữa.</span>';
        return;
      }
      $('loiDN').textContent=r.msg;PIN='';veO();return;
    }
    S.token=r.token;S.user=r.user;
    try{localStorage.setItem('mayo_token',r.token);}catch(e){}
    if(r.user.vai==='Khách')khoiDongKhach(); else khoiDong();
  }).withFailureHandler(function(){tai(false);$('loiDN').textContent='Mất kết nối. Thử lại.';PIN='';veO();})
  .dangNhap(PIN);
}
function dangXuat(){
  try{localStorage.removeItem('mayo_token');}catch(e){}
  S.token=null;S.user=null;PIN='';veO();
  $('app').style.display='none';$('manDangNhap').style.display='flex';
}

function khoiDong(){
  goi('bootDayDu',{ngay:hnay()}).then(function(d){
    napBoot(d);
    $('manDangNhap').style.display='none';
    $('app').style.display='flex';
    veTabs();
    doiTab('homNay');
  });
}
function napBoot(d){
  S.D=d;S.ngay=d.homNay;
  S.D.the=d.the||[];
  if(d.cauHinh&&(d.cauHinh.LOGO_ID||d.cauHinh.QR_ID)&&!S.logoB64&&!S.qrB64)
    goi('anhThuongHieu',{},true).then(function(l){
      S.logoB64=l.logo;S.qrB64=l.qr;
    }).catch(function(){});
  S.dsBe=d.dsBe||[];
  S.lich=d.lichHomNay||[];S.lichNgay=d.homNay;
}

/* ═══════════ CỔNG KHÁCH HÀNG ═══════════ */
function khoiDongKhach(){
  goi('bootKhach').then(function(d){
    S.D=d;S.ngay=d.homNay;
    $('manDangNhap').style.display='none';
    $('app').style.display='flex';
    veTabsKhach();doiTabKhach('nha');
  });
}
function veTabsKhach(){
  var ds=[['nha','Bé của tôi',IC.hoSo],['the','Thẻ ưu đãi',IC.baoGia],['lich','Lịch hẹn',IC.homNay]];
  $('tabs').innerHTML=ds.map(function(x){
    return '<button data-t="'+x[0]+'" onclick="doiTabKhach(\''+x[0]+'\')">'+
      '<svg viewBox="0 0 24 24">'+x[2]+'</svg>'+x[1]+'</button>';}).join('');
}
function doiTabKhach(t){
  [].forEach.call($('tabs').children,function(b){b.className=b.dataset.t===t?'on':'';});
  $('mh').scrollTop=0;
  nhanh('kh','khachTongQuan',{},function(d){
    S._kh=d;
    ({nha:khNha,the:khThe,lich:khLich})[t](d);
  });
}

function khNha(d){
  var t=d.the||{};
  dat('Bé của tôi',(S.user.ten||'')+(t.premium?' · Premium':''),null);
  S._ct=d.banner||[];
  var h=veChuongTrinh(S._ct);
  if(t.premium)h+=veChipPremium(t);
  h+='<div class="the" style="border-color:var(--do)"><div class="hang">'+
    '<div class="giua"><div class="rnho">Tổng số lần đến Mayo</div>'+
    '<div style="font-size:34px;font-weight:800;color:var(--do);letter-spacing:-.02em">'+
      (t.tongLan||0)+' lần</div></div>'+
    '<div style="text-align:right"><div class="rnho">bé</div><div class="dam" style="font-size:22px">'+
      (t.soBe||0)+'</div></div></div></div>';
  if(t.the&&t.the.conHan&&t.the.mocKe)
    h+='<div class="the" style="background:var(--do-nhat);border-color:var(--do)">'+
      '<span class="dam" style="color:var(--do)">Còn '+t.the.conThieu+' lần nữa</span> '+
      '<span class="nho">là bé được '+esc(t.the.mocKe.thuong)+'.</span></div>';
  h+='<div class="muc">Các bé</div>';
  (d.be||[]).forEach(function(b){
    h+='<div class="the" onclick="khXemBe(\''+b.MaBe+'\')"><div class="hang">'+avatar(b,52)+
      '<div class="giua"><div class="dam" style="font-size:16px">'+esc(b.TenBe)+'</div>'+
      '<div class="nho">'+esc(chuanLoai(b.Loai))+' · '+esc(b.Giong||'')+' · '+esc(b.CanNang||'?')+'kg</div>'+
      '<div class="rnho">'+(b.TongSoLan||0)+' lần'+(b.LanCuoiLam?' · gần nhất '+ngayVN(b.LanCuoiLam):'')+'</div></div>'+
      '<span class="nho">›</span></div></div>';
  });
  if(!(d.be||[]).length)h+='<div class="trong"><b>Chưa có hồ sơ bé</b>Nhắn Zalo cho Mayo để được thêm.</div>';
  h+='<button class="nut phu rong" style="margin-top:22px" onclick="dangXuat()">Thoát</button>';
  $('mh').innerHTML=h;
}
/* Băng chuyền chương trình. Trượt bằng cuộn ngang có điểm dừng nên mượt trên
   mọi máy, và bấm vào một ảnh là mở chi tiết chương trình đó. */
function veChuongTrinh(ds){
  if(!ds.length)return'';
  var h='<div class="bn"><div class="bn-cuon" id="bnCuon">';
  ds.forEach(function(b,i){
    h+='<div class="bn-o" onclick="xemChuongTrinh('+i+')">'+
      '<img src="https://drive.google.com/thumbnail?id='+esc(b.AnhID)+'&sz=w1000" alt="'+esc(b.TieuDe||'')+'" loading="lazy">'+
      '<span class="bn-nhan'+(b.trangThai==='Sắp diễn ra'?' sap':'')+'">'+esc(b.trangThai)+'</span>'+
      ((b.TieuDe||b.MoTa)?'<div class="bn-chu"><b>'+esc(b.TieuDe||'')+'</b>'+
        (b.MoTa?'<span>'+esc(b.MoTa)+'</span>':'')+'</div>':'')+
      '</div>';
  });
  h+='</div>'+(ds.length>1?'<div class="bn-cham" id="bnCham">'+
    ds.map(function(_,i){return '<i'+(i?'':' class="on"')+'></i>';}).join('')+'</div>':'')+'</div>';
  setTimeout(function(){khoiDongBanner(ds.length);},30);
  return h;
}
function xemChuongTrinh(i){
  var b=(S._ct||[])[i];if(!b)return;
  var thoiGian=b.tu?(ngayVN(b.tu)+(b.den?' → '+ngayVN(b.den):' trở đi')):(b.den?'đến '+ngayVN(b.den):'');
  var h='<img src="https://drive.google.com/thumbnail?id='+esc(b.AnhID)+'&sz=w1000" '+
      'style="width:100%;border-radius:12px;display:block">'+
    '<div class="hang" style="margin:14px 0 4px">'+
      '<span class="chip'+(b.trangThai==='Sắp diễn ra'?' cam':'')+'">'+esc(b.trangThai)+'</span>'+
      (thoiGian?'<div class="giua rnho" style="text-align:right">'+esc(thoiGian)+'</div>':'')+'</div>'+
    '<div style="font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:8px">'+esc(b.TieuDe||'')+'</div>'+
    (b.MoTa?'<div class="nho" style="margin-top:4px">'+esc(b.MoTa)+'</div>':'');
  if(b.NoiDung)
    h+='<div class="the" style="margin-top:14px;white-space:pre-line">'+esc(b.NoiDung)+'</div>';
  if(b.MaVoucher)
    h+='<div class="the" style="border-color:var(--do);background:var(--do-nhat)">'+
      '<div class="rnho" style="color:var(--do)">Mã áp dụng</div>'+
      '<div class="dam" style="font-size:26px;letter-spacing:.12em;color:var(--do)">'+esc(b.MaVoucher)+'</div>'+
      '<div class="rnho" style="margin-top:6px">Đọc mã này cho nhân viên khi tới tiệm.</div></div>';
  if(b.DieuKien)
    h+='<div class="muc">Điều kiện áp dụng</div><div class="the nho" style="white-space:pre-line">'+
      esc(b.DieuKien)+'</div>';
  var sdt=String((S.D.cauHinh||{}).HOTLINE||'').replace(/\D/g,'');
  if(b.Link)
    h+='<a class="nut rong" style="margin-top:16px" href="'+esc(b.Link)+'" target="_blank" rel="noopener">'+
      esc(b.NhanNut||'Xem thêm')+'</a>';
  else if(sdt)
    h+='<a class="nut rong" style="margin-top:16px" href="https://zalo.me/'+sdt+'" target="_blank" rel="noopener">'+
      esc(b.NhanNut||'Nhắn Zalo để đặt lịch')+'</a>';
  moTam('Chương trình',h);
}
function khoiDongBanner(n){
  var el=$('bnCuon');if(!el)return;
  clearInterval(window._bnHen);
  var capNhat=function(){
    var i=Math.round(el.scrollLeft/el.clientWidth);
    var c=$('bnCham');if(!c)return;
    [].forEach.call(c.children,function(x,k){x.className=k===i?'on':'';});
  };
  el.onscroll=function(){clearTimeout(el._t);el._t=setTimeout(capNhat,60);};
  if(n<2)return;
  window._bnHen=setInterval(function(){
    if(!document.body.contains(el)){clearInterval(window._bnHen);return;}
    var i=Math.round(el.scrollLeft/el.clientWidth);
    el.scrollTo({left:((i+1)%n)*el.clientWidth,behavior:'smooth'});
  },5000);
}
function veChipPremium(t){
  return '<div class="the" style="border-color:var(--do);background:var(--do-nhat);'+
    'display:flex;align-items:center;gap:10px">'+
    '<span class="chip" style="background:var(--do);color:#fff">PREMIUM</span>'+
    '<div class="giua nho" style="color:var(--do)">'+
    (t.the&&t.the.hanDen?'Thẻ ưu đãi dùng đến '+ngayVN(t.the.hanDen):'Đang có thẻ ưu đãi')+
    '</div></div>';
}

function khThe(d){
  var t=d.the||{};
  dat('Thẻ ưu đãi',(t.the?t.the.tenThe:'Chưa có thẻ'),null);
  var h='';
  if(!t.the){
    h+='<div class="trong"><b>Bé chưa có thẻ ưu đãi</b>'+
      'Hỏi Mayo khi tới tiệm để được mở thẻ tích luỹ.</div>';
    $('mh').innerHTML=h;return;
  }
  var c=t.the;
  h+=veChipPremium(t);
  var pct=c.tongMoc?Math.min(100,Math.round(c.tich/c.tongMoc*100)):0;
  h+='<div class="the" style="border-color:var(--do)">'+
    '<div class="rnho">'+esc(c.tenThe)+'</div>'+
    '<div style="font-size:38px;font-weight:800;color:var(--do);letter-spacing:-.02em;line-height:1.15">'+
      c.tich+' / '+c.tongMoc+'</div>'+
    '<div class="rnho">lần tắm đã tích</div>'+
    '<div style="height:12px;background:var(--do-nhat);border-radius:999px;margin:14px 0 8px;overflow:hidden">'+
      '<div style="height:100%;width:'+pct+'%;background:var(--do);border-radius:999px"></div></div>'+
    (c.mocKe?'<div class="dam">Còn '+c.conThieu+' lần nữa là được '+esc(c.mocKe.thuong)+'</div>'
            :'<div class="dam" style="color:var(--xanh)">Đã hoàn thành thẻ</div>')+
    (c.hanDen?'<div class="rnho" style="margin-top:8px">'+
      (c.conHan?'Dùng đến '+ngayVN(c.hanDen):'Thẻ đã hết hạn '+ngayVN(c.hanDen))+'</div>':'')+
    '</div>';

  h+='<div class="muc">Các mốc</div>';
  (c.moc||[]).forEach(function(m){
    var xong=c.tich>=m.lan, nhan=(c.daNhan||[]).indexOf(m.lan)>-1;
    h+='<div class="the'+(xong&&!nhan?' sk-tre':'')+'"><div class="hang">'+
      '<div class="giua"><div class="dam">Mốc '+m.lan+' lần</div>'+
      '<div class="nho">'+esc(m.thuong)+'</div></div>'+
      '<span class="chip '+(nhan?'xanh':(xong?'':'xam'))+'">'+
      (nhan?'đã nhận':(xong?'chờ nhận':'còn '+(m.lan-c.tich)+' lần'))+'</span></div></div>';
  });
  if((c.dangCho||[]).length)
    h+='<div class="the" style="border-color:var(--do)"><span class="dam" style="color:var(--do)">'+
      'Bé đang có phần thưởng chưa nhận.</span> <span class="nho">Nhắc Mayo khi tới tiệm nhé.</span></div>';
  if(c.moTa)h+='<div class="the rnho">'+esc(c.moTa)+'</div>';
  $('mh').innerHTML=h;
}

function khLich(d){
  dat('Lịch hẹn','Của các bé nhà bạn',null);
  var h='<div class="muc">Sắp tới</div>';
  if(!(d.sapToi||[]).length)h+='<div class="the nho">Chưa có lịch nào. Nhắn Zalo '+
    esc((S.D.cauHinh||{}).HOTLINE||'')+' để đặt giờ.</div>';
  (d.sapToi||[]).forEach(function(r){
    h+='<div class="the"><div class="hang"><div class="giua">'+
      '<div class="dam">'+ngayVN(r.Ngay)+' · '+esc(r.Gio)+'</div>'+
      '<div class="nho">'+esc(r.TenBe)+' · '+esc(r.DichVu)+'</div></div>'+
      '<span class="chip '+(CHIP[r.TrangThai]||'')+'">'+esc(r.TrangThai)+'</span></div></div>';
  });
  h+='<div class="muc">Đã làm</div>';
  (d.daLam||[]).forEach(function(r){
    h+='<div class="the" style="padding:11px 13px"><div class="hang"><div class="giua">'+
      '<div class="dam">'+ngayVN(r.Ngay)+'</div>'+
      '<div class="nho">'+esc(r.TenBe)+' · '+esc(r.DichVu)+'</div></div></div></div>';
  });
  $('mh').innerHTML=h;
}

function khXemBe(ma){
  goi('khachHoSo',{maBe:ma}).then(function(c){
    var b=c.be;
    var h='<div class="the"><div class="hang">'+avatar(b,64)+
      '<div class="giua"><div style="font-size:19px;font-weight:800">'+esc(b.TenBe)+'</div>'+
      '<div class="nho">'+esc(chuanLoai(b.Loai))+' · '+esc(b.Giong||'')+' · '+esc(b.CanNang||'?')+'kg</div>'+
      '<div class="rnho">'+(b.TongSoLan||0)+' lần đến Mayo</div></div></div></div>';
    h+='<div class="muc">Nhắc tẩy giun · trị ve</div>';
    if(!c.sucKhoe.length)h+='<div class="the nho">Chưa có ghi nhận.</div>';
    c.sucKhoe.forEach(function(x){
      h+='<div class="the'+(x.treHan?' sk-tre':'')+'" style="padding:11px 13px"><div class="hang">'+
        '<div class="giua"><div class="dam">'+esc(x.TenLoai)+'</div>'+

function bacCua(loai,kg){
  kg=parseFloat(kg);if(!kg)return null;
  loai=chuanLoai(loai)||'Cún';
  var ds=S.D.bac.filter(function(b){return chuanLoai(b.Loai)===loai;});
  for(var i=0;i<ds.length;i++){
    var t=num(ds[i].CanTuKg),d=num(ds[i].CanDenKg);
    if((i===0&&kg<=d)||(kg>t&&kg<=d))return ds[i];
  }
  return ds[ds.length-1]||null;
}
function tenBac(ma){var b=S.D.bac.filter(function(x){return x.MaBac===ma;})[0];return b?b.TenBac:ma;}
function dichVuCho(loai,maBac){
  loai=chuanLoai(loai);
  return S.D.bangGia.filter(function(g){return chuanLoai(g.Loai)===loai&&g.BacCanNang===maBac;});
}
/* ── VOUCHER ──────────────────────────────────────────────────────────
   Nhân viên không phải nhớ chương trình nào đang chạy. App tự dò voucher
   hợp lệ, tự chọn cái có lợi nhất cho khách và điền sẵn; đổi hoặc bỏ được. */
function giamCua(v,tamTinh,cacLoai,cacNhom){
  if(!v)return 0;
  if(tamTinh<num(v.DonToiThieu))return 0;
  var ap=String(v.ApDungCho||'Tất cả').trim();
  if(ap&&ap!=='Tất cả'){
    var hop=cacLoai.indexOf(chuanLoai(ap))>-1||cacNhom.indexOf(ap)>-1;
    if(!hop)return 0;
  }
  var g=v.LoaiGiam==='Phần trăm'?Math.round(tamTinh*num(v.GiaTri)/100):num(v.GiaTri);
  var tran=num(v.ToiDaGiam);
  if(tran>0&&g>tran)g=tran;
  return Math.min(g,tamTinh);
}
function voucherHopLe(tamTinh,cacLoai,cacNhom,chiTuDien){
  return (S.D.voucher||[]).filter(function(v){
    if(chiTuDien&&v.TuDien!=='Có')return false;
    return giamCua(v,tamTinh,cacLoai,cacNhom)>0;
  });
}
function voucherTheoMa(ma){
  var ds=S.D.voucher||[];
  ma=String(ma||'').trim().toUpperCase();
  for(var i=0;i<ds.length;i++)
    if(String(ds[i].MaVoucher).toUpperCase()===ma)return ds[i];
  return null;
}

/** Mô tả chi tiết một gói, để in vào báo giá gửi khách. */
function moTaGoi(ten,loai){
  loai=chuanLoai(loai);
  var ds=S.D.goi||[];
  for(var i=0;i<ds.length;i++)
    if(ds[i].TenDichVu===ten&&chuanLoai(ds[i].Loai)===loai)return ds[i];
  return null;
}
function tinhTong(giaGoc,dsPP){
  var cong=0,pct=0,phut=0;
  dsPP.forEach(function(p){
    phut+=parseInt(p.ThoiGianThem,10)||0;
    if(p.CachTinh==='Nhân %')pct+=num(p.GiaTri); else cong+=num(p.GiaTri);
  });
  var base=num(giaGoc)+cong;
  return {tien:Math.round(base*(1+pct/100)),phuPhi:Math.round(base*(1+pct/100))-num(giaGoc),phut:phut};
}

function datThoChinh(v){
  DL.tho=v;
  DL.thoPhu=DL.thoPhu.filter(function(x){return x!==v;});
  veDatLich();
}
function tgThoPhu(ten){
  var i=DL.thoPhu.indexOf(ten);
  if(i>-1)DL.thoPhu.splice(i,1); else DL.thoPhu.push(ten);
  veDatLich();
}
function congGio(g,p){
  var a=g.split(':'),m=parseInt(a[0],10)*60+parseInt(a[1],10)+p;
  return pad(Math.floor(m/60)%24)+':'+pad(m%60);
}
/** Tìm ngay trên máy: danh sách bé đã tải sẵn lúc mở app, gõ tới đâu ra tới đó. */
function locBe(q){
  q=(q||'').toLowerCase().trim();
  if(!q)return S.dsBe.slice(-40).reverse();
  var so=q.replace(/\D/g,'');
  return S.dsBe.filter(function(b){
    if(so&&String(b.SDT).indexOf(so)>-1)return true;
    return (b.TenBe+' '+b.TenChu+' '+b.Giong+' '+b.SDT).toLowerCase().indexOf(q)>-1;
  }).slice(0,60);
}
function timBeDL(q){
    if(!$('kqBe'))return;
    if(q.length<2){$('kqBe').innerHTML='';return;}
    (function(ds){
      $('kqBe').innerHTML=ds.length?ds.slice(0,8).map(function(b){
        return '<button class="chon" onclick="chonBe(\''+b.MaBe+'\')">'+avatar(b,40)+'<span class="giua">'+
          '<span class="dam" style="display:block">'+esc(b.TenBe)+'</span>'+
          '<span class="rnho">'+esc(b.Giong||chuanLoai(b.Loai))+' · '+esc(b.CanNang||'?')+'kg · '+esc(b.TenChu)+' · '+esc(sdt(b.SDT))+'</span></span></button>';
      }).join(''):'<div class="nho">Không tìm thấy. Tạo hồ sơ mới bên dưới.</div>';
    })(locBe(q));
}
function chonBe(ma){
  goi('chiTietBe',{maBe:ma}).then(function(c){DL.be=c.be;DL.dv=null;DL.pp=[];veDatLich();});
}
function chonDV(ma){
  DL.dv=S.D.bangGia.filter(function(g){return g.MaDV===ma;})[0];
  if(!DL.gio)DL.gio='';
  veDatLich();
}
function togglePP(ma){
  var i=DL.pp.findIndex(function(x){return x.MaPP===ma;});
  if(i>-1)DL.pp.splice(i,1);
  else DL.pp.push(S.D.phuPhi.filter(function(p){return p.MaPP===ma;})[0]);
  veDatLich();
}
function luuLichHen(){
  if(!DL.gio){toast('Chưa chọn giờ bắt đầu');return;}
  if(!DL.tho){toast('Chưa gán thợ');return;}
  var t=tinhTong(DL.dv.GiaNiemYet,DL.pp);
  var moTa=DL.maLich?'Đã lưu thay đổi':'Đã đặt lịch cho '+DL.be.TenBe;
  var xong=function(){S.lichNgay=null;napLaiLich();};
  toast(moTa);
  S.ngay=DL.ngay;S.lichNgay=null;doiTab('homNay');
  goi('luuLich',{lich:{
    MaLich:DL.maLich||'',Ngay:DL.ngay,GioBatDau:DL.gio,
    ThoiLuongPhut:(parseInt(DL.dv.ThoiLuongChuan,10)||60)+t.phut,
    MaBe:DL.be.MaBe,TenBe:DL.be.TenBe,DichVu:DL.dv.TenDichVu,MaDV:DL.dv.MaDV,
    Tho:DL.tho,ThoPhu:DL.thoPhu.join(', '),
    TrangThai:DL.maLich?undefined:'Chờ xác nhận',KenhDat:DL.kenh,
    GiaDichVu:num(DL.dv.GiaNiemYet),PhuPhiJSON:JSON.stringify(DL.pp),
    TienPhuPhi:t.phuPhi,GiaBao:t.tien,CocDaThu:num(DL.coc),GhiChu:DL.ghi
  }},true).then(xong)
   .catch(function(){toast('Chưa lưu được lịch — kiểm tra mạng');xong();});
}

/* ═══════════ ẢNH VÀ VIDEO ═══════════ */
function docB64(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){res(fr.result.split(',')[1]);};
    fr.onerror=rej;
    fr.readAsDataURL(file);
  });
}
/* Giữ nguyên độ phân giải gốc. Chỉ thu nhỏ khi file vượt ngưỡng, vì gói dữ liệu
   quá lớn sẽ bị Apps Script từ chối giữa chừng và ảnh mất trắng. */
function nenNeuQuaTo(file,mbToiDa){
  var mb=file.size/1048576;
  if(mb<=mbToiDa)return docB64(file).then(function(b){return {b64:b,kieu:file.type||'image/jpeg',nen:false};});
  return new Promise(function(res,rej){
    var img=new Image(),fr=new FileReader();
    fr.onload=function(){img.src=fr.result;};
    fr.onerror=rej;
    img.onload=function(){
      var max=2560,r=Math.min(1,max/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');
      cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      res({b64:cv.toDataURL('image/jpeg',0.9).split(',')[1],kieu:'image/jpeg',nen:true});
    };
    fr.readAsDataURL(file);
  });
}
function chupAnh(maBe,loai,maLich,maLan){
  var inp=$('chonAnh');
  inp.setAttribute('accept','image/*');
  if(loai==='chinh')inp.removeAttribute('multiple'); else inp.setAttribute('multiple','');
  inp.onchange=function(){
    var files=[].slice.call(inp.files);
    inp.value='';
    if(!files.length)return;
    if(loai!=='chinh'&&files.length>4){toast('Mỗi ca tối đa 4 ảnh — lấy 4 tấm đầu');files=files.slice(0,4);}
    var mbMax=parseFloat((S.D.cauHinh||{}).ANH_TOI_DA_MB)||8;

    /* Nén song song rồi gửi song song. Trước đây làm tuần tự nên 4 tấm ảnh
       mất bốn lượt chờ nối nhau; giờ chúng chạy cùng lúc. Người dùng cũng
       không phải đứng nhìn: báo ngay rồi để việc gửi chạy nền. */
    toast(files.length>1?'Đang gửi '+files.length+' ảnh…':'Đang gửi ảnh…');
    var nen=0;
    Promise.all(files.map(function(f){return nenNeuQuaTo(f,mbMax);}))
      .then(function(ds){
        return Promise.all(ds.map(function(o){
          if(o.nen)nen++;
          var p={maBe:maBe,loai:loai,base64:o.b64,kieu:o.kieu};
          if(maLich)p.maLich=maLich;
          if(maLan)p.maLan=maLan;
          return goi('luuAnh',p,true);
        }));
      })
      .then(function(kq){
        toast('Đã lưu '+kq.length+' ảnh'+(nen?' ('+nen+' tấm thu nhỏ vì quá lớn)':''));
        xoaDem('be:'+maBe);
        if(loai==='chinh')goi('dsBe',{},true).then(function(ds){S.dsBe=ds;});
        if($('tam').classList.contains('mo'))xemBe(maBe);
      })
      .catch(function(){toast('Có ảnh chưa gửi được — kiểm tra mạng rồi thử lại');});
  };
  inp.click();
}

/* ═══════════ XUẤT HỒ SƠ RA ẢNH ═══════════ */
function napAnh(src){
  return new Promise(function(res){
    if(!src){res(null);return;}
    var im=new Image();
    im.onload=function(){res(im);};
    im.onerror=function(){res(null);};
    im.src=src;
  });
}
/* Watermark: logo phóng lớn, mờ, nằm giữa. Đủ để nhận ra nguồn khi ảnh được
   chia sẻ lại, nhưng không che mất thông tin khách cần đọc. */
function veWatermark(g,logo,W,H){
  if(!logo){
    g.save();
    g.globalAlpha=.05;
    g.translate(W/2,H/2);g.rotate(-Math.PI/9);
    g.fillStyle='#BE1E2D';g.font='800 190px "Be Vietnam Pro",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText('MAYO',0,0);
    g.restore();return;
  }
  var w=W*0.62,r=logo.height/logo.width,hh=w*r;
  g.save();
  g.globalAlpha=.07;
  g.translate(W/2,H/2);g.rotate(-Math.PI/9);
  g.drawImage(logo,-w/2,-hh/2,w,hh);
  g.restore();
}
function veTieuDeMayo(g,logo,x,y){
  if(logo){
    var w=190,hh=w*(logo.height/logo.width);
    if(hh>96){hh=96;w=hh*(logo.width/logo.height);}
    g.drawImage(logo,x,y-hh+16,w,hh);
    return;
  }
  g.fillStyle='#BE1E2D';g.font='800 58px "Be Vietnam Pro",sans-serif';g.fillText('MAYO',x,y);
  g.fillStyle='#8C8079';g.font='600 19px "Be Vietnam Pro",sans-serif';
  g.fillText('PETSHOP · SPA & GROOMING',x,y+31);
}

function xuatHoSo(maBe){
  goi('hoSoXuat',{maBe:maBe}).then(function(d){
    var ba=(d.buoiAnh&&d.buoiAnh.truoc)||[], sa=(d.buoiAnh&&d.buoiAnh.sau)||[];
    return Promise.all(
      [napAnh(d.anhBe),napAnh(d.logo)]
        .concat(ba.map(napAnh)).concat(sa.map(napAnh))
    ).then(function(im){
      var k=2;
      var truoc=im.slice(k,k+ba.length).filter(Boolean); k+=ba.length;
      var sau=im.slice(k,k+sa.length).filter(Boolean);
      veAnhHoSo(d,im[0],im[1],truoc,sau);
    });
  });
}
function veAnhHoSo(d,anhBe,logo,imTruoc,imSau){
  imTruoc=imTruoc||[];imSau=imSau||[];
  var b=d.be,cfg=d.cauHinh||{},spa=d.spa||{};
  var coAnh=(imTruoc.length||imSau.length);
  var W=1080,L=60,R=W-60;
  var H=760 + 230                                  // khối lịch spa
        + (coAnh?372:0)
        + Math.min(d.lichSu.length,5)*58 + 70
        + d.sucKhoe.length*46 + 70
        + (d.anhEm.length?90:0);
  var cv=$('canvasBG'),g=cv.getContext('2d');
  cv.width=W;cv.height=H;
  g.fillStyle='#FFFCF7';g.fillRect(0,0,W,H);
  veWatermark(g,logo,W,H);
  for(var i=0;i<W;i+=60){g.fillStyle=(i/60)%2?'#FFFFFF':'#BE1E2D';g.fillRect(i,0,60,26);}

  veTieuDeMayo(g,logo,L,110);
  g.textAlign='right';
  g.fillStyle='#8C8079';g.font='600 20px "Be Vietnam Pro",sans-serif';
  g.fillText('HỒ SƠ THÚ CƯNG',R,96);
  g.font='500 19px "Be Vietnam Pro",sans-serif';
  g.fillText('Cập nhật '+ngayVN(hnay()),R,124);
  g.textAlign='left';

  /* Ảnh tròn + tên */
  var y=248,Rr=88;
  g.save();
  g.beginPath();g.arc(L+Rr,y,Rr,0,Math.PI*2);g.closePath();g.clip();
  if(anhBe){
    var s=Math.max(Rr*2/anhBe.width,Rr*2/anhBe.height);
    g.drawImage(anhBe,L+Rr-anhBe.width*s/2,y-anhBe.height*s/2,anhBe.width*s,anhBe.height*s);
  }else{
    g.fillStyle='#FBEAEC';g.fillRect(L,y-Rr,Rr*2,Rr*2);
    g.fillStyle='#BE1E2D';g.font='800 86px "Be Vietnam Pro",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText((b.TenBe||'?').charAt(0).toUpperCase(),L+Rr,y);
    g.textAlign='left';g.textBaseline='alphabetic';
  }
  g.restore();
  g.strokeStyle='#EDE4DA';g.lineWidth=3;
  g.beginPath();g.arc(L+Rr,y,Rr,0,Math.PI*2);g.stroke();

  var x2=L+Rr*2+32;
  g.fillStyle='#241D1A';g.font='800 48px "Be Vietnam Pro",sans-serif';
  g.fillText(b.TenBe||'',x2,y-22);
  g.fillStyle='#5A514B';g.font='500 24px "Be Vietnam Pro",sans-serif';
  g.fillText([chuanLoai(b.Loai),b.Giong,b.GioiTinh].filter(Boolean).join(' · '),x2,y+16);
  g.fillText((b.CanNang||'?')+'kg'+(b.NgaySinh?' · sinh '+ngayVN(b.NgaySinh):''),x2,y+50);
  g.fillStyle='#8C8079';g.font='500 21px "Be Vietnam Pro",sans-serif';
  g.fillText('Chủ: '+(b.TenChu||'')+'  ·  '+sdt(b.SDT),x2,y+84);

  y+=160;

  /* ── LỊCH SPA: khối lớn nhất, đặt ngay đầu, vì đây là lý do khách giữ tờ này ── */
  g.fillStyle='#BE1E2D';g.fillRect(L,y,R-L,196);
  g.fillStyle='rgba(255,255,255,.82)';g.font='700 20px "Be Vietnam Pro",sans-serif';

function veAnhBill(d,logo,qr){
  var cv=$('canvasBG'),g=cv.getContext('2d'),W=1080,L=60,R=W-60;
  var cfg=d.cauHinh||{};
  var tong=0,coc=0,giam=0,maVC='';
  d.dong.forEach(function(x){
    tong+=x.tong;coc+=x.coc;giam+=(x.giam||0);
    if(x.voucher)maVC=x.voucher;
  });
  var tamTinh=tong+giam;
  var conLai=Math.max(0,tong-coc);

  var H=390;
  d.dong.forEach(function(x){H+=96+x.phuPhi.length*38;});
  H+=200+(giam>0?90:0);                      // khối tổng
  H+=qr?400:150;                             // khối QR
  cv.width=W;cv.height=H;

  g.fillStyle='#FFFCF7';g.fillRect(0,0,W,H);
  veWatermark(g,logo,W,H);
  for(var i=0;i<W;i+=60){g.fillStyle=(i/60)%2?'#FFFFFF':'#BE1E2D';g.fillRect(i,0,60,26);}

  veTieuDeMayo(g,logo,L,110);
  g.textAlign='right';
  g.fillStyle='#8C8079';g.font='600 20px "Be Vietnam Pro",sans-serif';
  g.fillText('HOÁ ĐƠN DỊCH VỤ',R,96);
  g.font='500 19px "Be Vietnam Pro",sans-serif';
  g.fillText(ngayVN(d.ngay),R,124);
  g.textAlign='left';

  var y=214;
  g.fillStyle='#241D1A';g.font='700 28px "Be Vietnam Pro",sans-serif';
  g.fillText(d.chu.ten||'Khách lẻ',L,y);
  g.fillStyle='#8C8079';g.font='500 22px "Be Vietnam Pro",sans-serif';
  g.fillText(sdt(d.chu.sdt),L,y+32);
  y+=76;
  g.strokeStyle='#EDE4DA';g.lineWidth=2;
  g.beginPath();g.moveTo(L,y);g.lineTo(R,y);g.stroke();
  y+=46;

  d.dong.forEach(function(x){
    g.fillStyle='#241D1A';g.font='700 27px "Be Vietnam Pro",sans-serif';
    g.fillText(x.tenBe+' · '+x.dichVu,L,y);
    g.textAlign='right';g.font='700 27px "Be Vietnam Pro",sans-serif';
    g.fillText(tien(x.giaDichVu),R,y);g.textAlign='left';
    y+=34;
    g.fillStyle='#8C8079';g.font='500 20px "Be Vietnam Pro",sans-serif';
    g.fillText('groomer '+(x.tho||'')+(x.thoPhu?'  ·  hỗ trợ '+x.thoPhu:''),L,y);
    y+=44;
    g.font='500 22px "Be Vietnam Pro",sans-serif';
    x.phuPhi.forEach(function(p){
      g.fillStyle='#5A514B';g.fillText('+ '+p.TenPhuPhi,L+22,y);
      g.textAlign='right';
      g.fillText(p.CachTinh==='Nhân %'?'+'+p.GiaTri+'%':tien(p.GiaTri),R,y);
      g.textAlign='left';y+=38;
    });
    y+=18;
    g.strokeStyle='#F0E9E1';g.lineWidth=1;
    g.beginPath();g.moveTo(L,y-16);g.lineTo(R,y-16);g.stroke();
  });

  if(giam>0){
    g.fillStyle='#5A514B';g.font='500 23px "Be Vietnam Pro",sans-serif';
    g.fillText('Tạm tính',L,y+10);
    g.textAlign='right';g.fillText(tien(tamTinh),R,y+10);g.textAlign='left';
    g.fillStyle='#1E7A4F';g.font='700 23px "Be Vietnam Pro",sans-serif';
    g.fillText('Giảm'+(maVC?' · mã '+maVC:''),L,y+52);
    g.textAlign='right';g.fillText('− '+tien(giam),R,y+52);g.textAlign='left';
    y+=90;
  }
  g.fillStyle='#BE1E2D';g.fillRect(L,y-6,R-L,104);
  g.fillStyle='#fff';g.font='600 26px "Be Vietnam Pro",sans-serif';
  g.fillText(conLai>0&&coc>0?'Còn phải thu':'Tổng cộng',L+28,y+48);
  g.font='800 46px "Be Vietnam Pro",sans-serif';g.textAlign='right';
  g.fillText(tien(conLai>0?conLai:tong),R-28,y+56);g.textAlign='left';
  y+=126;
  if(coc>0){
    g.fillStyle='#8C8079';g.font='500 21px "Be Vietnam Pro",sans-serif';
    g.fillText('Tổng dịch vụ '+tien(tong)+'  ·  đã cọc '+tien(coc),L,y);
    y+=40;
  }
  var daThu=d.dong.every(function(x){return x.daThu==='Đã thu';});
  if(daThu){
    g.fillStyle='#1E7A4F';g.font='700 26px "Be Vietnam Pro",sans-serif';
    g.fillText('✓ Đã thanh toán — cảm ơn bạn',L,y+8);

  y+=60;

  if(qr){
    var Q=290,qx=(W-Q)/2;
    g.fillStyle='#fff';g.fillRect(qx-20,y-20,Q+40,Q+40);
    g.strokeStyle='#EDE4DA';g.lineWidth=2;g.strokeRect(qx-20,y-20,Q+40,Q+40);
    g.drawImage(qr,qx,y,Q,Q);
    g.textAlign='center';
    g.fillStyle='#241D1A';g.font='700 24px "Be Vietnam Pro",sans-serif';
    g.fillText(cfg.TEN_TK||cfg.TEN_TIEM||'Mayo Petshop',W/2,y+Q+62);

    if(cfg.SO_TK)g.fillText(cfg.SO_TK,W/2,y+Q+94);
    g.fillText('Quét mã và nhập số tiền phía trên. Mayo nhận cả tiền mặt.',W/2,y+Q+126);
    g.textAlign='left';
  }else{
    g.fillStyle='#8C8079';g.font='500 22px "Be Vietnam Pro",sans-serif';
    g.fillText('Chưa cấu hình mã QR — vào Thêm → Cài đặt để tải lên.',L,y+20);
  }

  g.fillStyle='#BE1E2D';g.font='700 23px "Be Vietnam Pro",sans-serif';
  g.fillText((cfg.TEN_TIEM||'Mayo Petshop')+' · '+(cfg.DIA_CHI||'')+' · Zalo '+(cfg.HOTLINE||''),L,H-42);

  cv.toBlob(function(bl){
    var url=URL.createObjectURL(bl);
    moTam('Hoá đơn',
      '<img src="'+url+'" style="width:100%;border-radius:12px;border:1px solid var(--vien)">'+
      '<div class="rnho" style="margin:12px 0">Nhấn giữ ảnh để lưu, hoặc đưa màn hình cho khách quét mã.</div>'+
      '<a class="nut rong" download="bill-mayo-'+d.ngay+'.png" href="'+url+'">Tải bill về máy</a>');
  },'image/png');
}

function thuCamOn(maLich){

    return Promise.all([napAnh(d.logo),napAnh(d.anhBe)]).then(function(im){

function veThuCamOn(d,logo,anhBe){
  var cv=$('canvasBG'),g=cv.getContext('2d'),W=1080,L=70,R=W-70;
  var cfg=d.cauHinh||{},t=(d.the&&d.the.the)||null;
  var H=1180+(t?230:0);
  cv.width=W;cv.height=H;

  g.fillStyle='#FFFCF7';g.fillRect(0,0,W,H);
  veWatermark(g,logo,W,H);
  for(var i=0;i<W;i+=60){g.fillStyle=(i/60)%2?'#FFFFFF':'#BE1E2D';g.fillRect(i,0,60,26);}
  g.fillStyle='#BE1E2D';g.fillRect(0,H-14,W,14);

  veTieuDeMayo(g,logo,L,116);

  /* Ảnh bé tròn, canh giữa — đây là thứ khách nhìn đầu tiên */
  var cy=330,Rr=110;
  g.save();
  g.beginPath();g.arc(W/2,cy,Rr,0,Math.PI*2);g.closePath();g.clip();
  if(anhBe){
    var s=Math.max(Rr*2/anhBe.width,Rr*2/anhBe.height);
    g.drawImage(anhBe,W/2-anhBe.width*s/2,cy-anhBe.height*s/2,anhBe.width*s,anhBe.height*s);
  }else{
    g.fillStyle='#FBEAEC';g.fillRect(W/2-Rr,cy-Rr,Rr*2,Rr*2);
    g.fillStyle='#BE1E2D';g.font='800 100px "Be Vietnam Pro",sans-serif';
    g.textAlign='center';g.textBaseline='middle';
    g.fillText((d.tenBe||'?').charAt(0).toUpperCase(),W/2,cy);
    g.textBaseline='alphabetic';
  }
  g.restore();
  g.strokeStyle='#BE1E2D';g.lineWidth=5;
  g.beginPath();g.arc(W/2,cy,Rr,0,Math.PI*2);g.stroke();

  g.textAlign='center';
  g.fillStyle='#8C8079';g.font='600 22px "Be Vietnam Pro",sans-serif';
  g.fillText('CẢM ƠN BẠN',W/2,cy+178);
  g.fillStyle='#241D1A';g.font='800 54px "Be Vietnam Pro",sans-serif';
  g.fillText(d.tenBe||'',W/2,cy+236);
  g.fillStyle='#5A514B';g.font='500 25px "Be Vietnam Pro",sans-serif';
  wrap2(g,'đã đến Mayo ngày '+ngayVN(d.ngay)+
    (d.dichVu?' cho '+d.dichVu:'')+(d.tho?', groomer '+d.tho:'')+'.',W/2,cy+282,R-L,36);

  /* Số lần tắm — con số làm khách thấy mình gắn bó */
  var y=cy+380;
  g.fillStyle='#BE1E2D';
  if(g.roundRect){g.beginPath();g.roundRect(L,y,R-L,150,18);g.fill();}
  else g.fillRect(L,y,R-L,150);
  g.fillStyle='rgba(255,255,255,.85)';g.font='600 21px "Be Vietnam Pro",sans-serif';
  g.fillText('SỐ LẦN '+String(d.tenBe||'BÉ').toUpperCase()+' ĐẾN MAYO',W/2,y+48);
  g.fillStyle='#fff';g.font='800 70px "Be Vietnam Pro",sans-serif';
  g.fillText((d.soLanBe||0)+' lần',W/2,y+118);
  y+=196;

  if(t){
    g.fillStyle='#241D1A';g.font='700 27px "Be Vietnam Pro",sans-serif';
    g.fillText(t.tenThe+' · '+t.tich+'/'+t.tongMoc,W/2,y+8);
    var bw=R-L,pct=t.tongMoc?Math.min(1,t.tich/t.tongMoc):0;
    g.fillStyle='#FBEAEC';
    if(g.roundRect){g.beginPath();g.roundRect(L,y+34,bw,20,10);g.fill();}else g.fillRect(L,y+34,bw,20);
    g.fillStyle='#BE1E2D';
    if(g.roundRect){g.beginPath();g.roundRect(L,y+34,Math.max(20,bw*pct),20,10);g.fill();}
    else g.fillRect(L,y+34,bw*pct,20);
    g.fillStyle='#5A514B';g.font='500 24px "Be Vietnam Pro",sans-serif';
    g.fillText(t.mocKe?('Còn '+t.conThieu+' lần nữa là bé được '+t.mocKe.thuong)
                      :'Bé đã hoàn thành thẻ — nhớ nhận thưởng nhé',W/2,y+96);
    if(t.hanDen){
      g.fillStyle=t.conHan?'#8C8079':'#BE1E2D';g.font='600 21px "Be Vietnam Pro",sans-serif';
      g.fillText((t.conHan?'Thẻ dùng đến ':'Thẻ đã hết hạn ')+ngayVN(t.hanDen),W/2,y+134);
    }
    y+=230;
  }

  g.fillStyle='#8C8079';g.font='500 23px "Be Vietnam Pro",sans-serif';
  wrap2(g,'Hẹn gặp lại bé lần sau. Có gì cần hỏi, bạn cứ nhắn Zalo cho Mayo.',W/2,H-160,R-L,34);
  g.fillStyle='#BE1E2D';g.font='700 24px "Be Vietnam Pro",sans-serif';
  g.fillText((cfg.TEN_TIEM||'Mayo Petshop')+' · '+(cfg.DIA_CHI||'')+' · Zalo '+(cfg.HOTLINE||''),W/2,H-70);
  g.textAlign='left';

  cv.toBlob(function(bl){
    var url=URL.createObjectURL(bl);
    moTam('Thư cảm ơn',
      '<img src="'+url+'" style="width:100%;border-radius:12px;border:1px solid var(--vien)">'+
      '<div class="rnho" style="margin:12px 0">Nhấn giữ ảnh để lưu, rồi gửi cho khách qua Zalo.</div>'+
      '<a class="nut rong" download="camon-'+String(d.tenBe||'be').replace(/[^A-Za-z0-9]/g,'')+'.png" href="'+url+'">Tải ảnh về máy</a>');
  },'image/png');
}
/* Bọc dòng cho chữ canh giữa */
function wrap2(g,txt,cx,y,w,lh){
  var words=String(txt).split(' '),line='';
  words.forEach(function(wd){
    if(g.measureText(line+wd+' ').width>w){g.fillText(line,cx,y);line=wd+' ';y+=lh;}
    else line+=wd+' ';});
  g.fillText(line,cx,y);
}

/* ═══════════ SỨC KHOẺ ═══════════ */
function formSucKhoe(maBe,sk){
  var dm=(S._be&&S._be.sucKhoe&&S._be.sucKhoe.danhMuc)||[];
  sk=sk||{Ngay:hnay()};
  var h='<label>Loại</label><select id="sk_Loai" onchange="goiYNgayKe()">'+
    dm.filter(function(x){return x.TrangThai==='Đang hoạt động';}).map(function(x){
      return '<option value="'+esc(x.MaLoai)+'" data-ck="'+esc(x.ChuKyThang)+'"'+
        (sk.Loai===x.MaLoai?' selected':'')+'>'+esc(x.TenLoai)+' · nhắc mỗi '+esc(x.ChuKyThang)+' tháng</option>';
    }).join('')+'</select>'+
    '<div class="doi"><div><label>Ngày làm</label><input type="date" id="sk_Ngay" value="'+esc(sk.Ngay)+'" onchange="goiYNgayKe()"></div>'+
    '<div><label>Hẹn lần sau</label><input type="date" id="sk_LanKe" value="'+esc(sk.LanKe||'')+'"></div></div>'+
    '<label>Sản phẩm dùng</label><input id="sk_SanPham" value="'+esc(sk.SanPham||'')+'" placeholder="NexGard, Bravecto, Drontal…">'+
    '<label>Ghi chú</label><input id="sk_GhiChu" value="'+esc(sk.GhiChu||'')+'">'+
    '<button class="nut rong" style="margin-top:18px" onclick="luuSK(\''+maBe+'\',\''+(sk.MaSK||'')+'\')">Lưu</button>';

  goiYNgayKe();
}
function goiYNgayKe(){
  var s=$('sk_Loai'),n=$('sk_Ngay'),k=$('sk_LanKe');
  if(!s||!n||!k||k.value)return;
  var ck=parseInt(s.options[s.selectedIndex].dataset.ck,10)||0;
  if(!ck||!n.value)return;
  var d=new Date(n.value+'T00:00:00');
  d.setMonth(d.getMonth()+ck);
  k.value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function luuSK(maBe,maSK){
  var o={MaSK:maSK,MaBe:maBe};
  ['Loai','Ngay','LanKe','SanPham','GhiChu'].forEach(function(k){o[k]=$('sk_'+k).value;});
  if(!o.Ngay){toast('Chưa chọn ngày làm');return;}
  luuNgay('luuSucKhoe',{sk:o},{
    bao:'Đã ghi mũi',
    truoc:function(){xoaDem('be:'+maBe);},
    xong:function(r){datDem('be:'+maBe,r.chiTiet);xemBe(maBe);}
  });
}

/* ═══════════ 4 · BÁO GIÁ ═══════════ */
/* Một chủ thường dắt hai ba bé tới cùng lúc và chỉ trả một lần.
   Báo giá vì vậy là một hoá đơn nhiều dòng, không phải nhiều báo giá rời. */
var BG={ds:[],ghi:'',mo:0,vc:null,tuChon:false,ckBat:false,ckKieu:'%',ckGT:''};
var _bgId=0;

function mhBaoGia(){
  dat('Báo giá','Một bill cho cả nhà','📋',dsBaoGiaCu);
  BG={ds:[],ghi:'',mo:0,vc:null,tuChon:false,ckBat:false,ckKieu:'%',ckGT:''};
  S._vcKH=null;
  veBaoGia();
}
function bgMuc(be,loai,kg){
  return {id:++_bgId,be:be||null,loai:chuanLoai(loai||(be&&be.Loai)||'Cún'),
          kg:kg||(be&&be.CanNang)||'',dv:[],pp:[]};
}
function bgTong(m){
  var goc=m.dv.reduce(function(s,g){return s+num(g.GiaNiemYet);},0);
  return tinhTong(goc,m.pp);
}
function bgTamTinh(){
  return BG.ds.reduce(function(s,m){return s+bgTong(m).tien;},0);
}
function bgLoai(){
  var r=[];BG.ds.forEach(function(m){if(r.indexOf(m.loai)<0)r.push(m.loai);});return r;
}
function bgNhom(){
  var r=[];
  BG.ds.forEach(function(m){m.dv.forEach(function(g){
    if(r.indexOf(g.NhomDichVu)<0)r.push(g.NhomDichVu);});});
  return r;
}
/* Tự điền: chọn voucher cho khách lợi nhất, trừ khi nhân viên đã chọn tay. */
function tuDienVoucher(){
  if(BG.tuChon)return;
  var t=bgTamTinh();
  var ds=voucherHopLe(t,bgLoai(),bgNhom(),true);
  var tot=null,max=0;
  ds.forEach(function(v){
    var g=giamCua(v,t,bgLoai(),bgNhom());
    if(g>max){max=g;tot=v;}
  });
  BG.vc=tot;
}
/* Chiết khấu tay: dùng khi chủ tiệm muốn giảm cho một trường hợp cụ thể
   mà không cần tạo mã. Cộng dồn sau voucher, không thay thế voucher. */
function bgChietKhau(){
  if(!BG.ckBat)return 0;
  var conLai=bgTamTinh()-giamCua(BG.vc,bgTamTinh(),bgLoai(),bgNhom());
  var g=BG.ckKieu==='%'?Math.round(conLai*num(BG.ckGT)/100):num(BG.ckGT);
  return Math.max(0,Math.min(g,conLai));
}
function bgGiam(){
  return giamCua(BG.vc,bgTamTinh(),bgLoai(),bgNhom())+bgChietKhau();
}
function bgTongBill(){
  return Math.max(0,bgTamTinh()-bgGiam());
}
function datVoucher(ma){
  var v=voucherTheoMa(ma);
  if(!v){toast('Không có mã này hoặc mã đã hết hiệu lực');return;}
  if(giamCua(v,bgTamTinh(),bgLoai(),bgNhom())<=0){
    toast('Mã "'+v.MaVoucher+'" chưa đủ điều kiện cho bill này');return;
  }
  BG.vc=v;BG.tuChon=true;veBaoGia();
}
function boVoucher(){BG.vc=null;BG.tuChon=true;veBaoGia();}
function tgChietKhau(){BG.ckBat=!BG.ckBat;if(!BG.ckBat)BG.ckGT='';veBaoGia();}
function nhapVoucher(){
  var ma=prompt('Nhập mã voucher:');
  if(ma)datVoucher(ma);
}
function bgPhut(m){
  return m.dv.reduce(function(s,g){return s+(parseInt(g.ThoiLuongChuan,10)||0);},0)+bgTong(m).phut;
}

        var nhom={};
        S.D.phuPhi.filter(function(p){return chuanLoai(p.ApDungCho).indexOf(m.loai)>-1;})
          .forEach(function(p){(nhom[p.NhomPhuPhi]=nhom[p.NhomPhuPhi]||[]).push(p);});
        Object.keys(nhom).forEach(function(kk){
          h+='<div class="rnho" style="margin:10px 0 6px">'+esc(kk)+'</div><div class="dai">';

              'onclick="tgPP('+m.id+',\''+p.MaPP+'\')">'+(on?'✓ ':'')+esc(p.TenPhuPhi)+' · '+

          });
          h+='</div>';
        });
        if(m.dv.length||m.pp.length)
          h+='<div class="rnho" style="margin-top:12px">Dự kiến '+bgPhut(m)+' phút cho bé này.</div>';

      h+='<button class="rnho" style="color:var(--do);font-weight:700;margin-top:12px" '+
         'onclick="boBe('+m.id+')">✕ Bỏ bé này khỏi bill</button>';
    }
    h+='</div>';
  });

  /* Gợi ý thêm anh em cùng nhà */
  var goiY=[];
  BG.ds.forEach(function(m){
    if(!m.be)return;
    var so=String(m.be.SDT).replace(/\D/g,'');

  h+='<div class="the" style="margin-top:12px;padding:11px"><input id="qBG" placeholder="Thêm bé khác…" '+

      '<div class="giua nho">Tạm tính</div><div class="tien">'+tien(bgTamTinh())+'</div></div>';
    if(giamVC>0)
      h+='<div class="hang" style="padding:4px 0"><div class="giua nho" style="color:var(--xanh)">'+

        '<div class="tien" style="color:var(--xanh)">−'+tien(giamCK)+'</div></div>';

    '<div class="tien" style="font-size:25px;color:var(--do)">'+tien(bgTongBill())+'</div></div>'+
    '<div class="rnho" style="margin-top:6px">Hiệu lực '+(S.D.cauHinh.HAN_BAO_GIA_NGAY||7)+' ngày</div></div>';

                                   :'giảm '+tien(BG.vc.GiaTri))+
      (BG.tuChon?'':' · tự điền')+'</div></div>'+
      '<button class="nut be phu" onclick="boVoucher()">Bỏ</button></div>';
  }else{
    h+='<div class="rnho">Chưa áp mã nào.</div>';

      '<input class="giua" type="number" inputmode="decimal" value="'+esc(BG.ckGT)+'" '+

  var sanSang=BG.ds.some(function(m){return m.dv.length;});
  h+='<div style="display:grid;gap:8px;margin-top:14px">'+
    '<button class="nut rong" onclick="xuatAnhBaoGia()"'+(sanSang?'':' disabled')+'>Xuất ảnh gửi Zalo</button>'+

function timBeBG(q){
    if(!$('kqBG'))return;
    if(q.length<2){$('kqBG').innerHTML='';return;}
    (function(ds){
      $('kqBG').innerHTML=ds.slice(0,6).map(function(b){
        return '<button class="chon" onclick="themBe(\''+b.MaBe+'\')">'+avatar(b,40)+'<span class="giua">'+
          '<span class="dam" style="display:block">'+esc(b.TenBe)+'</span>'+
          '<span class="rnho">'+esc(b.CanNang||'?')+'kg · '+esc(b.TenChu)+' · '+esc(sdt(b.SDT))+'</span></span></button>';
      }).join('');
    })(locBe(q));
}
function themBe(ma){
  if(BG.ds.some(function(x){return x.be&&x.be.MaBe===ma;})){toast('Bé này đã có trong bill');return;}
  var b=beTheoMa(ma);
  if(!b){goi('chiTietBe',{maBe:ma}).then(function(c){napBe(c.be);});return;}
  napBe(b);
}
function napBe(b){
  var m=bgMuc(b);
  BG.ds.push(m);BG.mo=m.id;veBaoGia();
  // Khách có thể đang giữ mã riêng do Mayo tặng — nạp thêm vào kho mã của lần báo giá này.
  var maKH=String(b.SDT||'').replace(/\D/g,'');
  if(!maKH||S._vcKH===maKH)return;
  goi('voucherChoKhach',{maKH:maKH},true).then(function(ds){
    S._vcKH=maKH;
    S.D.voucher=ds;
    BG.tuChon=false;
    if(S.tab==='baoGia')veBaoGia();
  }).catch(function(){});
}
function themKhachMoi(){
  var loai=$('bgLoai').value,kg=$('bgKg').value;
  if(!kg){toast('Nhập cân nặng ước tính');return;}
  var m=bgMuc(null,loai,kg);
  BG.ds.push(m);BG.mo=m.id;veBaoGia();
}
function boBe(id){
  BG.ds=BG.ds.filter(function(m){return m.id!==id;});
  if(BG.mo===id)BG.mo=0;
  veBaoGia();
}
function mucTheoId(id){
  for(var i=0;i<BG.ds.length;i++)if(BG.ds[i].id===id)return BG.ds[i];
  return null;
}
function datKg(id,v){var m=mucTheoId(id);if(m){m.kg=v;m.dv=[];veBaoGia();}}
function tgDV(id,ma){
  var m=mucTheoId(id);if(!m)return;
  var i=m.dv.findIndex(function(x){return x.MaDV===ma;});
  if(i>-1)m.dv.splice(i,1); else m.dv.push(S.D.bangGia.filter(function(g){return g.MaDV===ma;})[0]);
  veBaoGia();
}
function tgPP(id,ma){
  var m=mucTheoId(id);if(!m)return;
  var i=m.pp.findIndex(function(x){return x.MaPP===ma;});
  if(i>-1)m.pp.splice(i,1); else m.pp.push(S.D.phuPhi.filter(function(p){return p.MaPP===ma;})[0]);
  veBaoGia();
}

function goiBaoGia(tt){
  var chu=BG.ds.filter(function(m){return m.be;})[0];
  var han=themNgay(hnay(),parseInt(S.D.cauHinh.HAN_BAO_GIA_NGAY,10)||7);
  return {MaBaoGia:'',
    MaBe:BG.ds.map(function(m){return m.be?m.be.MaBe:'';}).filter(String).join(','),
    TenBe:BG.ds.map(function(m){return m.be?m.be.TenBe:'Bé '+m.loai;}).join(', '),
    SDT:chu?sdt(chu.be.SDT):'',
    DichVuJSON:JSON.stringify(BG.ds.map(function(m){
      return {be:m.be?m.be.TenBe:'Bé '+m.loai, loai:m.loai, kg:m.kg,
              dv:m.dv.map(function(g){return {ten:g.TenDichVu,gia:num(g.GiaNiemYet)};}),

function datCaNha(){
  var co=BG._co||[],ngay=$('nl_ngay').value,gio=$('nl_gio').value,kenh=$('nl_kenh').value;
  if(!gio){toast('Chưa chọn giờ bắt đầu');return;}
  var ds=[],cur=gio;
  for(var k=0;k<co.length;k++){
    var m=co[k],tho=$('nl_tho'+k).value;
    if(!tho){toast('Chưa gán thợ cho '+m.be.TenBe);return;}
    var t=bgTong(m),phut=bgPhut(m);
    ds.push({Ngay:ngay,GioBatDau:cur,ThoiLuongPhut:phut,MaBe:m.be.MaBe,TenBe:m.be.TenBe,
      DichVu:m.dv.map(function(g){return g.TenDichVu;}).join(' + '),
      MaDV:m.dv.map(function(g){return g.MaDV;}).join(','),Tho:tho,
      TrangThai:'Chờ xác nhận',KenhDat:kenh,
      GiaDichVu:m.dv.reduce(function(s,g){return s+num(g.GiaNiemYet);},0),
      PhuPhiJSON:JSON.stringify(m.pp),TienPhuPhi:t.phuPhi,GiaBao:t.tien,GhiChu:BG.ghi});
    cur=congGio(cur,phut);
  }
  /* Chia phần giảm cho từng bé theo tỷ lệ, để bill từng ca vẫn cộng ra đúng tổng. */
  var giam=bgGiam(),tt=bgTamTinh();
  if(giam>0&&tt>0){
    var conLai=giam;
    ds.forEach(function(l,k){
      var phan=k===ds.length-1?conLai:Math.round(giam*num(l.GiaBao)/tt);
      conLai-=phan;
      l.MaVoucher=BG.vc?BG.vc.MaVoucher:'';
      l.TienGiam=phan;
      l.GiaBao=Math.max(0,num(l.GiaBao)-phan);
    });
  }
  goi('luuBaoGia',{baoGia:goiBaoGia('Đã chốt')}).then(function(){
    if(BG.vc)goi('dungVoucher',{ma:BG.vc.MaVoucher},true).catch(function(){});
    return goi('luuNhieuLich',{ds:ds});
  }).then(function(){
    dongTam();toast('Đã đặt '+ds.length+' lịch');
    S.ngay=ngay;S.lichNgay=null;doiTab('homNay');
  });
}

function wrap(g,txt,x,y,w,lh){
  var words=String(txt).split(' '),line='';
  words.forEach(function(wd){
    if(g.measureText(line+wd+' ').width>w){g.fillText(line,x,y);line=wd+' ';y+=lh;}
    else line+=wd+' ';});
  g.fillText(line,x,y);
}

       dvs.map(function(d){return '<th style="text-align:right">'+esc(d)+'</th>';}).join('')+'</tr>';

        h+='<td style="text-align:right">'+(g?(S.user.q.suaGia?

function taiAnhTH(khoa){
  var inp=$('chonAnh');
  inp.setAttribute('accept','image/png,image/jpeg');
  inp.removeAttribute('multiple');
  inp.onchange=function(){
    var f=inp.files[0];inp.value='';
    if(!f)return;
    tai(true);
    nenNeuQuaTo(f,4).then(function(o){
      return goi('luuAnhCauHinh',{khoa:khoa,base64:o.b64,kieu:o.kieu});
    }).then(function(r){
      tai(false);
      if(r.khoa==='QR_ID')S.qrB64=r.b64; else S.logoB64=r.b64;
      toast(r.khoa==='QR_ID'?'Đã cập nhật mã QR':'Đã cập nhật logo');
      mhCaiDat();
    }).catch(function(){tai(false);});

function luuNV(){
  var o={};

  if(!o.HoTen||!/^\d{4}$/.test(o.PIN)){toast('Cần họ tên và PIN 4 số');return;}
  luuNgay('luuNhanVien',{nv:o},{
    bao:'Đã lưu nhân viên',
    truoc:function(){xoaDem('nv');},
    xong:function(ds){datDem('nv',ds);mhCaiDat();}

function nhanh(khoa,action,p,ve){
  var cu=S.cache[khoa];
  if(cu!==undefined)ve(cu);
  else if($('mh'))$('mh').innerHTML=khungXuong(5);
  goi(action,p,cu!==undefined).then(function(d){
    var moi=JSON.stringify(d);
    if(S.cacheJS[khoa]===moi)return;      // không có gì đổi, khỏi vẽ lại
    S.cache[khoa]=d;S.cacheJS[khoa]=moi;
    ve(d);
  }).catch(function(){});
}

 * bắt họ nhìn vạch tải 1–2 giây mỗi lần lưu là thứ khó chịu nhất của app này.
 * Ghi hỏng thì báo rõ và mở lại đúng chỗ, không nuốt lỗi.
 */
function luuNgay(action,p,opt){
  opt=opt||{};
  dongTam();
  if(opt.truoc)opt.truoc();
  toast(opt.bao||'Đã lưu');
  return goi(action,p,true).then(function(r){
    if(opt.xong)opt.xong(r);
  }).catch(function(){
    toast('Chưa lưu được — kiểm tra mạng rồi thử lại');
    if(opt.hong)opt.hong();
  });
}
function xoaDem(){

    delete S.cache[arguments[i]];delete S.cacheJS[arguments[i]];
  }
}
