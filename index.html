<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<!-- ═══════════ TÊN VÀ CHẾ ĐỘ TOÀN MÀN HÌNH ═══════════ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mayo">
<!-- CỐ TÌNH KHÔNG dùng black-translucent.
     black-translucent cho nội dung tràn lên NẰM DƯỚI đồng hồ, sóng và pin của
     iPhone. App có vạch tải và nhãn "Đang xử lý…" ghim ở mép trên, nên chúng
     chui thẳng xuống dưới thanh trạng thái và bị che mất.
     Chỉ chỉnh bằng env(safe-area-inset-*) bên trong app thì KHÔNG cứu được:
     iframe không phải tài liệu gốc nên env() trả về 0. Phải xử lý ở đây. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFCF7">
<title>Mayo Petshop</title>

<!-- ═══════════ ICON MÀN HÌNH CHÍNH ═══════════
     iOS gần như BỎ QUA manifest và chỉ đọc apple-touch-icon, nên phải khai báo
     cả hai đường. Thiếu apple-touch-icon là iPhone chụp ảnh màn hình trang web
     làm icon — đúng hiện tượng anh đang gặp.

     iOS cũng KHÔNG tự bo góc ảnh có nền trong suốt, nên các tệp apple-touch-icon
     phải có nền đặc kín mép. Manifest của Android thì ngược lại, cần bản
     "maskable" chừa lề an toàn để hệ thống tự cắt theo hình dạng của máy. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* Trang bọc chịu trách nhiệm chừa lề an toàn, vì nó là tài liệu GỐC — chỉ ở
     đây env(safe-area-inset-*) mới trả về số thật. Bên trong iframe luôn là 0.
     Đẩy khung xuống dưới tai thỏ rồi, app bên trong cứ vẽ từ toạ độ 0 như bình
     thường mà không có gì bị che. */
  html{height:100%;overscroll-behavior:none}
  body{
    margin:0;height:100%;box-sizing:border-box;
    background:#FFFCF7;overflow:hidden;
    /* Chặn kéo-để-tải-lại ở TẦNG NGOÀI CÙNG.
       iOS nghe lệnh tải lại từ tài liệu gốc, mà tài liệu gốc chính là trang này
       chứ không phải app trong khung. Chỉ chặn bên trong app là chưa đủ: cú kéo
       vẫn chuyền ra tới đây và trang vẫn nạp lại, xoá sạch mọi thứ đang nhập dở. */
    overscroll-behavior:none;
    padding-top:env(safe-area-inset-top,0px);
  }
  iframe{border:0;display:block;width:100%;height:100%}

  /* ═══════════ MÀN HÌNH CHÀO ═══════════
     Màn trắng anh thấy là lúc trang này đang tải iframe từ Apps Script — app
     chưa chạy nên nó không thể tự che. Vì vậy màn chào nằm ở ĐÂY.

     Màn chào CHE thời gian chờ vốn có, không CỘNG THÊM thời gian chờ: nó tắt
     ngay khi iframe tải xong, chỉ giữ tối thiểu đủ để hiệu ứng chạy hết.

     Khối logo kết thúc ở ĐÚNG toạ độ của khối logo trên màn đăng nhập (neo
     7vh tính từ mép trên, cùng cỡ hình, cùng cỡ chữ). Nhờ vậy lúc màn chào mờ
     đi, logo không nhảy chỗ — mắt đọc thành một chuyển động liền mạch chứ
     không phải hai màn hình khác nhau nối đuôi. */
  #chao{
    position:fixed;inset:0;z-index:9999;background:#FFFCF7;
    transition:opacity .4s ease .1s, visibility .4s .1s;
  }
  #chao.tat{opacity:0;visibility:hidden}

  #chao .vien{position:absolute;top:0;left:0;right:0;height:14px;
    background:repeating-linear-gradient(90deg,#BE1E2D 0 26px,#fff 26px 52px);
    animation:vienVao .5s cubic-bezier(.2,.8,.3,1) both}
  @keyframes vienVao{from{transform:translateY(-14px)}to{transform:translateY(0)}}

  /* Khối trôi: bắt đầu ở giữa màn hình, kết thúc ở vị trí màn đăng nhập.
     Cộng thêm safe-area vì #chao phủ toàn khung máy, còn iframe thì đã bị đẩy
     xuống dưới tai thỏ — không cộng thì lệch đúng bằng chiều cao thanh trạng thái. */
  #chao .khoi{
    position:absolute;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;
    top:50%;transform:translateY(-50%);
    transition:top .72s cubic-bezier(.65,0,.3,1),
               transform .72s cubic-bezier(.65,0,.3,1);
  }
  #chao .khoi.len{
    top:calc(env(safe-area-inset-top,0px) + 7vh);
    transform:translateY(0);
  }

  /* Cỡ hình và cỡ chữ PHẢI trùng khít với .dn-hieu bên trong app.
     Lệch một chút là lúc chuyển sẽ thấy logo giật cỡ. */
  #chao .khoi>img:first-child{width:min(44vw,172px);height:auto;display:block;
    animation:loVao .9s cubic-bezier(.22,1,.3,1) both}
  @keyframes loVao{
    0%  {opacity:0;transform:scale(.88) translateY(12px)}
    60% {opacity:1}
    100%{opacity:1;transform:scale(1) translateY(0)}
  }
  /* Bộ chữ MAYO tách từ chính file logo rồi đổi sang đỏ — cùng một tệp với
     màn đăng nhập trong app. Font hệ thống gõ lại thì nét khác hẳn, và lúc màn
     chào mờ đi khách sẽ thấy chữ đổi kiểu ngay trước mắt. */
  #chao .ten{
    margin-top:12px;width:min(40vw,156px);height:auto;display:block;
    animation:chuVao .6s cubic-bezier(.22,1,.3,1) .3s both;
  }
  @keyframes chuVao{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (max-width:380px){
    #chao .khoi>img:first-child{width:min(46vw,150px)}
    #chao .ten{width:min(42vw,136px)}
  }

  /* Ba chấm nảy — dấu hiệu "đang chạy, chưa treo" trong lúc chờ mạng.
     Mờ đi khi khối bắt đầu trôi lên, để lúc chuyển cảnh không còn gì nhấp nháy. */
  #chao .cham{position:absolute;left:0;right:0;
    bottom:calc(58px + env(safe-area-inset-bottom,0px));
    display:flex;justify-content:center;gap:7px;
    animation:chuVao .5s ease-out .7s both;transition:opacity .3s}
  #chao.roi .cham{opacity:0}
  #chao .cham i{width:7px;height:7px;border-radius:50%;background:#E4A7AE;
    animation:nay 1.1s ease-in-out infinite}
  #chao .cham i:nth-child(2){animation-delay:.16s}
  #chao .cham i:nth-child(3){animation-delay:.32s}
  @keyframes nay{0%,80%,100%{transform:translateY(0);opacity:.55}
                 40%{transform:translateY(-6px);opacity:1}}

  /* Máy bật chế độ giảm chuyển động: bỏ hiệu ứng, khối đứng luôn ở vị trí cuối. */
  @media (prefers-reduced-motion:reduce){
    #chao *{animation:none !important;transition:none !important}
    #chao .khoi{top:calc(env(safe-area-inset-top,0px) + 7vh);transform:none}
  }

</style>
</head>

/* ═══════════ TẮT MÀN CHÀO ═══════════

   Chỉ làm đúng một việc: tắt màn chào khi khung đã tải.

   Bản trước có thêm cơ chế tự dò "app có bị chặn không" rồi hiện lối thoát.
   Đã bỏ hẳn. Lý do: khung nhúng khác nguồn nên KHÔNG BAO GIỜ đọc được bên
   trong để biết chắc app hỏng hay không — mọi cách dò đều là phỏng đoán, và
   phỏng đoán sai thì phá hỏng một app đang chạy bình thường. Điện thoại vốn
   không có vấn đề gì, thêm cơ chế dò vào chỉ tạo ra lỗi mới.

   Việc chặn cookie bên thứ ba trên máy tính là chuyện của cấu hình triển khai
   (Who has access = Anyone) và của cách phát link, không phải chuyện mà mã
   nguồn ở đây giải quyết được bằng cách đoán.

   Tắt khi có BẤT KỲ dấu hiệu nào: tín hiệu từ app, sự kiện load, hoặc hết 6
   giây. Rộng rãi như vậy vì màn chào không chịu tắt là lỗi nặng hơn nhiều so
   với tắt hơi sớm. */
(function(){
  var chao =document.getElementById('chao'),
      khoi =document.getElementById('khoiChao'),
      khung=document.getElementById('khung'),
      batDau=Date.now(), xong=false;

  function tat(){
    if(xong)return; xong=true;
    setTimeout(function(){
      chao.classList.add('roi');          // tắt ba chấm trước khi trôi
      khoi.classList.add('len');
      setTimeout(function(){
        chao.classList.add('tat');
        // Gỡ hẳn khỏi trang, tránh lớp phủ vô hình chặn thao tác chạm.
        setTimeout(function(){
          if(chao.parentNode)chao.parentNode.removeChild(chao);
        },700);
      },660);
    }, Math.max(0, 1150-(Date.now()-batDau)));
  }

  window.addEventListener('message',function(e){
    if(e.source===khung.contentWindow && e.data==='mayo-san-sang')tat();
  });
  khung.addEventListener('load',tat);
  setTimeout(tat,6000);
})();
</script>
