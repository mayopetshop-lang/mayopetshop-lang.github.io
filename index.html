<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<!-- ═══════════ TÊN VÀ CHẾ ĐỘ TOÀN MÀN HÌNH ═══════════ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mayo">
<!-- CỐ TÌNH KHÔNG dùng black-translucent.
     black-translucent cho nội dung tràn lên NẰM DƯỚI đồng hồ, sóng và pin của
     iPhone. App có vạch tải và nhãn "Đang xử lý…" ghim ở mép trên, nên chúng
     chui thẳng xuống dưới thanh trạng thái và bị che mất.
     Chỉ chỉnh bằng env(safe-area-inset-*) bên trong app thì KHÔNG cứu được:
     iframe không phải tài liệu gốc nên env() trả về 0. Phải xử lý ở đây. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFCF7">
<title>Mayo Petshop</title>

<!-- ═══════════ ICON MÀN HÌNH CHÍNH ═══════════
     iOS gần như BỎ QUA manifest và chỉ đọc apple-touch-icon, nên phải khai báo
     cả hai đường. Thiếu apple-touch-icon là iPhone chụp ảnh màn hình trang web
     làm icon — đúng hiện tượng anh đang gặp.

     iOS cũng KHÔNG tự bo góc ảnh có nền trong suốt, nên các tệp apple-touch-icon
     phải có nền đặc kín mép. Manifest của Android thì ngược lại, cần bản
     "maskable" chừa lề an toàn để hệ thống tự cắt theo hình dạng của máy. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* Trang bọc chịu trách nhiệm chừa lề an toàn, vì nó là tài liệu GỐC — chỉ ở
     đây env(safe-area-inset-*) mới trả về số thật. Bên trong iframe luôn là 0.
     Đẩy khung xuống dưới tai thỏ rồi, app bên trong cứ vẽ từ toạ độ 0 như bình
     thường mà không có gì bị che. */
  html{height:100%;overscroll-behavior:none}
  body{
    margin:0;height:100%;box-sizing:border-box;
    background:#FFFCF7;overflow:hidden;
    /* Chặn kéo-để-tải-lại ở TẦNG NGOÀI CÙNG.
       iOS nghe lệnh tải lại từ tài liệu gốc, mà tài liệu gốc chính là trang này
       chứ không phải app trong khung. Chỉ chặn bên trong app là chưa đủ: cú kéo
       vẫn chuyền ra tới đây và trang vẫn nạp lại, xoá sạch mọi thứ đang nhập dở. */
    overscroll-behavior:none;
    padding-top:env(safe-area-inset-top,0px);
  }
  iframe{border:0;display:block;width:100%;height:100%}
</style>
</head>
<body>

<!--
  ════════════════════════════════════════════════════════════════
  ĐÂY LÀ FILE DUY NHẤT ĐƯỢC ĐẶT TÊN index.html TRÊN GITHUB.
  Nó chỉ có nhiệm vụ mở app trong một khung, để giấu thanh thông
  báo màu xanh của Google. Toàn bộ mã app nằm ở Apps Script.

  KHÔNG dán nội dung file Index.html của app vào đây.

  Việc duy nhất cần làm: thay chuỗi bên dưới bằng link web app
  thật, lấy ở Apps Script → Deploy → Manage deployments → Web app URL.
  Link phải kết thúc bằng /exec
  ════════════════════════════════════════════════════════════════
-->
<iframe
  src="https://script.google.com/macros/s/AKfycbzU2tHev8MnVAvLTCAWSI7cZHCcZVTTpADwXGYLa416JXHGpS4gN4Ja6eW6AxThe1nC/exec"
  allow="camera; clipboard-write"
  title="Mayo Petshop">
</iframe>

</body>
</html>
